<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 1 — HTML-таблиця</title>
</head>
<body>
  <header>
    <h1 align="center">Завдання 1. Створення HTML-таблиці</h1>
  </header>

  <main>
    <div align="center">
      <table
        border="2"
        bordercolor="#000000"
        cellspacing="0"
        cellpadding="0"
        width="400"
        height="400"
        aria-label="Таблиця з кольоровими об'єднаними комірками"
      >
        <tbody>
          <tr height="50">
            <td colspan="8" bgcolor="#20e6c5"></td>
          </tr>
          <tr height="50">
            <td width="50" bgcolor="#fffbd2"></td>
            <td colspan="6" bgcolor="#20e6c5"></td>
            <td width="50" bgcolor="#fffbd2"></td>
          </tr>
          <tr height="50">
            <td colspan="2" bgcolor="#fffbd2"></td>
            <td colspan="4" bgcolor="#20e6c5"></td>
            <td colspan="2" bgcolor="#fffbd2"></td>
          </tr>
          <tr height="50">
            <td colspan="3" bgcolor="#fffbd2"></td>
            <td bgcolor="#ff1717"></td>
            <td bgcolor="#1727ed"></td>
            <td colspan="3" bgcolor="#fffbd2"></td>
          </tr>
          <tr height="50">
            <td colspan="2" bgcolor="#fffbd2"></td>
            <td bgcolor="#21ed24"></td>
            <td bgcolor="#fff52b"></td>
            <td colspan="4" bgcolor="#fffbd2"></td>
          </tr>
          <tr height="50">
            <td colspan="2" bgcolor="#fffbd2"></td>
            <td colspan="4" bgcolor="#20e6c5"></td>
            <td colspan="2" bgcolor="#fffbd2"></td>
          </tr>
          <tr height="50">
            <td bgcolor="#fffbd2"></td>
            <td colspan="6" bgcolor="#20e6c5"></td>
            <td bgcolor="#fffbd2"></td>
          </tr>
          <tr height="50">
            <td colspan="8" bgcolor="#20e6c5"></td>
          </tr>
        </tbody>
      </table>

      <p>
        <a href="../index.html">Повернутись на головну</a>
      </p>
    </div>
  </main>
</body>
</html>
